apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-services
  template:
    metadata:
      labels:
        app: notification-services
    spec:
      containers:
      - name: go-notification-service
        image: notification-service-go:latest
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: notification-service-secrets
              key: API_KEY
        - name: GITHUB_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: notification-service-secrets
              key: GITHUB_WEBHOOK_SECRET
        - name: SMTP_HOST
          value: "smtp.example.com"
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_USERNAME
          value: "user@example.com"
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: notification-service-secrets
              key: SMTP_PASSWORD
        - name: SMTP_SENDER
          value: "noreply@example.com"
      - name: java-notification-service
        image: notification-service-java:latest
        ports:
        - containerPort: 8080
        env:
        - name: SMTP_HOST
          value: "smtp.example.com"
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_USERNAME
          value: "user@example.com"
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: notification-service-secrets
              key: SMTP_PASSWORD
        - name: SMTP_SENDER
          value: "noreply@example.com"
