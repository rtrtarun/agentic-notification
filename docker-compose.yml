version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attention
      POSTGRES_USER: attention
      POSTGRES_PASSWORD: attention
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  go-notification-service:
    build:
      context: ./go-server/notification-service
      dockerfile: Dockerfile
    image: notification-service-go:latest
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USERNAME: user@example.com
      SMTP_PASSWORD: password
      SMTP_SENDER: noreply@example.com
      DATABASE_URL: postgres://attention:attention@postgres:5432/attention
      RULES_PATH: /app/config/rules.yaml
      DEFAULT_NOTIFY_EMAIL: ops@example.com
      API_KEY: local-dev-key
      GITHUB_WEBHOOK_SECRET: local-dev-webhook-secret
      REDIS_URL: redis://redis:6379/0
      # Browser origins allowed to call the API (the Vite dev server).
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      - postgres
      - redis

  java-notification-service:
    build:
      context: ./java-server/production
      dockerfile: Dockerfile
    image: notification-service-java:latest
    ports:
      - "8081:8080"
    environment:
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USERNAME: user@example.com
      SMTP_PASSWORD: password
      SMTP_SENDER: noreply@example.com
