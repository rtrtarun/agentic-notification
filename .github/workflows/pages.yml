name: Deploy console to GitHub Pages

# Publishes the web console as a static site. With no repository variable set it
# opens in demo mode (sample data), so a visitor can explore it with no service.
# To point it at a real service, add a repository variable BACKEND_URL (Settings >
# Secrets and variables > Actions > Variables), for example https://my-service.example.com;
# the console then asks visitors to enter the API key instead of showing the demo.
#
# One-time setup: repository Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # A project site is served from /<repository>/.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_BACKEND_URL: ${{ vars.BACKEND_URL }}
          VITE_DEFAULT_DEMO: ${{ vars.BACKEND_URL == '' && 'true' || 'false' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
