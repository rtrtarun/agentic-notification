name: CI

on:
  push:
    branches: [ main, feature-impl, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  go-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: go-server/notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-server/notification-service/go.mod
          cache-dependency-path: go-server/notification-service/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt needed"; exit 1; }
      - name: Vet
        run: go vet -tags integration ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          working-directory: go-server/notification-service
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Test (race, integration, coverage)
        # On failure the first failing lines are also written as an annotation, so the cause
        # is visible from the run summary and the API without opening the raw log.
        run: |
          set +e
          go test -race -tags integration -coverprofile=coverage.out ./... 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary=$(grep -E '^(--- FAIL|FAIL|panic:|WARNING: DATA RACE)|_test\.go:[0-9]+:|Error:|expected|got ' test.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=go test failed::${summary}"
          fi
          exit $code
      - name: Coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t >= 80) ? 0 : 1 }' || { echo "coverage below 80%"; exit 1; }

  java-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and test
        working-directory: java-server/notification-service
        run: mvn -B verify

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build
        working-directory: apps/web
        run: npm ci && npm test && npm run build

  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest -v
