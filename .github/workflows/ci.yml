name: CI

on:
  push:
    branches: [ main, feature-impl ]
  pull_request:
    branches: [ main ]

jobs:
  go-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-server/notification-service/go.mod
          cache-dependency-path: go-server/notification-service/go.sum
      - name: Test
        working-directory: go-server/notification-service
        run: go vet ./... && go test ./...

  java-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build
        working-directory: java-server/notification-service
        run: mvn -B package -DskipTests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build
        working-directory: apps/web
        run: npm ci && npm run build
