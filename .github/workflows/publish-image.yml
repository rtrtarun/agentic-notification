name: Publish service image

# Builds the Go service image and stores it in GitHub Container Registry
# (ghcr.io/<owner>/<repository>/notification-service). Any container host can
# then run it. Uses the built-in GITHUB_TOKEN; no secrets to create.

on:
  push:
    branches: [ main ]
    paths:
      - 'go-server/notification-service/**'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        # Registry names must be lower case.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/notification-service" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: go-server/notification-service
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
